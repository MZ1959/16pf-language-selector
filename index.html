<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>16PF Language Selection</title>

<style>
body {
    font-family: Segoe UI, Arial, sans-serif;
    background: #f4f6f8;
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.card {
    background: white;
    padding: 40px;
    border-radius: 16px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.15);
    text-align: center;
    max-width: 500px;
    width: 90%;
}

h1 {
    margin-top: 0;
    color: #333;
}

p {
    color: #666;
    margin-bottom: 30px;
}

.lang-btn {
    display: block;
    width: 100%;
    padding: 18px;
    margin: 12px 0;
    text-decoration: none;
    font-size: 20px;
    font-weight: 600;
    border-radius: 10px;
    color: white;
    transition: transform 0.15s ease;
}

.lang-btn:hover {
    transform: scale(1.02);
}

.en {
    background: #0078d4;
}

.fr {
    background: #107c10;
}

.it {
    background: #d83b01;
}

.footer {
    margin-top: 25px;
    font-size: 12px;
    color: #888;
}
</style>

</head>
<body>

<div class="card">

    <h1>16PF Personality Questionnaire</h1>

    <p>
        Please select your language<br>
        Veuillez sélectionner votre langue<br>
        Selezionare la lingua
    </p>

    <a class="lang-btn en"
   href="https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=DQSIkWdsW0yxEjajBLZtrQAAAAAAAAAAAAEbyDM-estUQlJYSTdJWldZQVBPMVRDQ0NTTTJBWldGWC4u">
   🇬🇧 16PF English
   </a>


    <a class="lang-btn fr"
       href="https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=DQSIkWdsW0yxEjajBLZtrQAAAAAAAAAAAAEbyDM-estURU5IUlNBTFZYNFAzUzIyNkJTSlMxMjBWOS4u">
       🇫🇷 Français
    </a>

    <a class="lang-btn it"
       href="https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=DQSIkWdsW0yxEjajBLZtrQAAAAAAAAAAAAEbyDM-estUNFRDQ1BHUEVKSUJPRUJUUzdaNlkyV0NBWi4u">
       🇮🇹 Italiano
    </a>

    <div class="footer">
        16PF Assessment
    </div>

</div>

</body>
</html>
